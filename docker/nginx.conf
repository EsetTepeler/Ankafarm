server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    index index.html;

    # www.<alan> -> <alan>: QR adresleri ve CORS tek biçimde kalsın. Traefik TLS'i sonlandırır,
    # asıl şema X-Forwarded-Proto ile gelir; yoksa https varsayılır.
    set $canonical_scheme $http_x_forwarded_proto;
    if ($canonical_scheme = "") { set $canonical_scheme https; }
    if ($host ~* ^www\.(.+)$) { return 301 $canonical_scheme://$1$request_uri; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Tarayıcı SQLite'ı (wasm + OPFS) SharedArrayBuffer ister; COOP/COEP her yanıtta olmalı.
    # nginx'te bir location içindeki add_header üst seviyedekileri devre dışı bırakır; bu yüzden
    # başlıklar her location'da tekrar yazılır. require-corp: Safari credentialless'ı desteklemez.
    # API yanıtları CORS ile geldiği için etkilenmez; API'den servis edilecek görseller
    # Cross-Origin-Resource-Policy: cross-origin başlığı taşımalı.

    # Çalışma anında üretilen yapılandırma, asla önbelleğe alınmaz.
    location = /config.json {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite çıktısı içerik özetli dosya adları üretir, uzun süre önbelleklenebilir.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker her zaman taze.
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: bilinmeyen yollar index.html'e düşer (QR bağlantıları /a/<uuid> gibi).
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
