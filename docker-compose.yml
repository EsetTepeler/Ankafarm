# Coolify bu dosyayı "Docker Compose" build pack ile deploy eder.
# SERVICE_* değişkenleri Coolify tarafından üretilir; yerelde .env dosyasından gelir.
# Yerel port eşlemeleri docker-compose.override.yml içinde (Coolify onu okumaz).

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ankafarm
      POSTGRES_USER: ankafarm
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DB}
      # İçgörü servisinin ayrı rolü ilk kurulumda db-init ile açılır.
      INSIGHTS_DB_PASSWORD: ${SERVICE_PASSWORD_INSIGHTS}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankafarm -d ankafarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      SERVICE_FQDN_API_3000:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ankafarm:${SERVICE_PASSWORD_DB}@db:5432/ankafarm
      JWT_SECRET: ${SERVICE_BASE64_64_JWT}
      WEB_ORIGIN: ${SERVICE_URL_WEB}
      SEED_FARM_NAME: ${SEED_FARM_NAME:-Anka Farm}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Çiftlik Sahibi}
      # Süper admin: tablo boşsa açılışta açılır. Verilmezse /admin konsoluna giriş yapılamaz.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Süper Admin}
      INSIGHTS_URL: http://insights:8000
      # Rol db-init ile yalnızca boş veritabanında açılır; mevcut kurulumda API açılışta güvenceye alır.
      INSIGHTS_DB_PASSWORD: ${SERVICE_PASSWORD_INSIGHTS}
    volumes:
      - uploads:/app/uploads
      # Yedeklerin gerçekten alındığı Ayarlar > Sistem durumu ekranından görünsün; sadece okuma.
      - backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Açılışta migration çalışıyor; bu süre boyunca başarısız kontroller sağlıksız saymaz.
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SERVICE_FQDN_WEB_80:
      API_URL: ${SERVICE_URL_API}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/config.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backup:
    image: prodrigestivill/postgres-backup-local:18
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ankafarm
      POSTGRES_USER: ankafarm
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DB}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "30"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "12"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # İmajda curl var, wget yok; go-cron durumu HEALTHCHECK_PORT üzerinden veriyor.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Fotoğraf ve belgeler veritabanında değil; pg_dump onları kapsamaz.
  # Günde bir kez uploads birimini arşivler, 30 günden eskiyi siler.
  # Python içgörü servisi: kayıtlardan kural tabanlı bulgular üretir, insights tablosuna yazar.
  # Dışarıya port açmaz; yalnızca api konteyneri çağırır.
  insights:
    build:
      context: ./apps/insights
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://insights:${SERVICE_PASSWORD_INSIGHTS}@db:5432/ankafarm
      TZ: Europe/Istanbul
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Slim imajda curl ve wget yok; istek Python ile atılır. Uç veritabanına da dokunur.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  uploads-backup:
    image: alpine:3
    restart: unless-stopped
    volumes:
      - uploads:/data:ro
      - backups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          mkdir -p /backups/uploads
          tar -czf "/backups/uploads/uploads-$$(date +%Y%m%d-%H%M).tar.gz" -C /data . 2>/dev/null || true
          find /backups/uploads -name 'uploads-*.tar.gz' -mtime +30 -delete 2>/dev/null || true
          sleep 86400
        done
    healthcheck:
      # Sunduğu bir uç yok: son 25 saatte arşiv üretilmişse döngü yaşıyor demektir.
      test: ["CMD-SHELL", "find /backups/uploads -name 'uploads-*.tar.gz' -mmin -1500 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      # İlk arşiv açılışta alınıyor ama büyük uploads biriminde sürebilir.
      start_period: 300s

volumes:
  pgdata:
  uploads:
  backups:
